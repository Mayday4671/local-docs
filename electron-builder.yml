appId: com.mayday.localdocs
productName: 我的文档库
directories:
  output: release/${version}
files:
  - out/**/*
  - package.json
asar: true
npmRebuild: false
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  installerLanguages: [zh_CN]
  language: '2052'
artifactName: local-docs-${version}-${arch}-setup.${ext}
